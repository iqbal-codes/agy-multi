name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto derives from Conventional Commit titles since the last tag)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: "Explicit version override (e.g. 0.6.0). Leave blank to derive deterministically."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview computed version and changelog without tagging or publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute release plan
        id: plan
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"

          ARGS=(plan --from "$LATEST_TAG" --bump "$INPUT_BUMP" --repo "$GITHUB_REPOSITORY")
          if [ -n "$INPUT_VERSION" ]; then
            ARGS+=(--version "$INPUT_VERSION")
          fi
          PLAN="$(bun src/release-plan.ts "${ARGS[@]}")"

          VERSION="$(printf '%s' "$PLAN" | jq -r '.version')"
          TAG="$(printf '%s' "$PLAN" | jq -r '.tag')"
          BUMP="$(printf '%s' "$PLAN" | jq -r '.bump')"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  prepare:
    name: Verify & tag release
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & test before release
        run: |
          bun run typecheck
          bun test

      - name: Prepare version, changelog & tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PREV_TAG: ${{ needs.resolve.outputs.previous_tag }}
          BUMP: ${{ needs.resolve.outputs.bump }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          bun src/release-plan.ts prepare \
            --from "$PREV_TAG" \
            --bump "$BUMP" \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --write >/dev/null

          bun src/release-plan.ts notes \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --from "$PREV_TAG" \
            --repo "$GITHUB_REPOSITORY" > release-notes.md

          {
            echo "### Release ${TAG}"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; skipping commit, tag, and release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git push origin HEAD:main

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Upload release notes artifact
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: notes-markdown
          path: release-notes.md

  build:
    needs: [resolve, prepare]
    if: ${{ !failure() && !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: agy-multi-linux-x64.tar.gz
            ext: ""
          - target: bun-linux-arm64
            asset: agy-multi-linux-arm64.tar.gz
            ext: ""
          - target: bun-darwin-arm64
            asset: agy-multi-darwin-arm64.tar.gz
            ext: ""
          - target: bun-darwin-x64
            asset: agy-multi-darwin-x64.tar.gz
            ext: ""
          - target: bun-windows-x64
            asset: agy-multi-windows-x64.zip
            ext: ".exe"
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binaries (${{ matrix.target }})
        run: |
          mkdir -p out release
          bun build --compile --minify --target=${{ matrix.target }} src/index.ts --outfile "out/agy-multi${{ matrix.ext }}"
          bun build --compile --minify --target=${{ matrix.target }} src/acp-bin.ts --outfile "out/agy-multi-acp${{ matrix.ext }}"

      - name: Package release archive
        run: |
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            zip -j "release/${{ matrix.asset }}" out/*
          else
            tar -czf "release/${{ matrix.asset }}" -C out .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/${{ matrix.asset }}

  release:
    needs: [resolve, prepare, build]
    if: ${{ !failure() && !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: notes-markdown
          path: notes

      - name: Generate SHA256SUMS.txt
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.resolve.outputs.tag }}" \
            release/* \
            --repo "${{ github.repository }}" \
            --title "${{ needs.resolve.outputs.tag }}" \
            --notes-file notes/release-notes.md \
            --latest
