name: PR Release Plan

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    # Fork pull requests get a read-only token, so labelling would fail there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Release plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Project the bump and pending release
        id: plan
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --tags --force origin >/dev/null 2>&1 || true
          git fetch --no-tags --force origin "$BASE_REF" >/dev/null

          IS_RELEASE_PR="false"
          if bun -e 'import { isReleasePullRequest } from "./src/release-plan"; process.exit(isReleasePullRequest(process.env.TITLE ?? "", process.env.HEAD_REF ?? "") ? 0 : 1)'; then
            IS_RELEASE_PR="true"
          fi
          echo "is_release_pr=$IS_RELEASE_PR" >> "$GITHUB_OUTPUT"

          PR_BUMP="$(bun src/release-plan.ts derive "$TITLE" "$BODY")"
          PACKAGE="$(git show "origin/$BASE_REF:package.json" | jq -r '.version // "0.0.0"')"
          TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          BASE="$(bun src/release-plan.ts base "$PACKAGE" "$TAG")"

          MAIN_PLAN="$(bun src/release-plan.ts plan --from "$TAG" --to "origin/$BASE_REF" --package "$PACKAGE")"
          MAIN_BUMP="$(printf '%s' "$MAIN_PLAN" | jq -r '.bump')"
          MAIN_COUNT="$(printf '%s' "$MAIN_PLAN" | jq -r '.commitCount')"
          COMBINED_BUMP="$(bun -e 'import { maxBump } from "./src/release-plan"; console.log(maxBump(process.argv[1] as any, process.argv[2] as any))' "$MAIN_BUMP" "$PR_BUMP")"
          PROJECTED="$(bun src/release-plan.ts next "$BASE" "$COMBINED_BUMP")"
          PR_PKG="$(jq -r '.version // "0.0.0"' package.json)"

          echo "pr_bump=$PR_BUMP" >> "$GITHUB_OUTPUT"
          echo "combined_bump=$COMBINED_BUMP" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-none}" >> "$GITHUB_OUTPUT"
          echo "main_count=$MAIN_COUNT" >> "$GITHUB_OUTPUT"
          echo "projected=$PROJECTED" >> "$GITHUB_OUTPUT"
          echo "pr_pkg=$PR_PKG" >> "$GITHUB_OUTPUT"

          if [ "$IS_RELEASE_PR" = "true" ] || [ "$PR_BUMP" = "patch" ]; then
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            echo "label=release:$PR_BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Label the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.plan.outputs.label }}
        run: |
          gh label create release:minor --color 0e8a16 --description "Minor semver bump on next release" --force
          gh label create release:major --color d93f0b --description "Major semver bump on next release" --force
          gh pr edit "$PR" --remove-label release:minor --remove-label release:major >/dev/null 2>&1 || true
          if [ -n "$LABEL" ]; then
            gh pr edit "$PR" --add-label "$LABEL" >/dev/null
          fi

      - name: Post the release plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          IS_RELEASE_PR: ${{ steps.plan.outputs.is_release_pr }}
          PR_BUMP: ${{ steps.plan.outputs.pr_bump }}
          COMBINED_BUMP: ${{ steps.plan.outputs.combined_bump }}
          BASE: ${{ steps.plan.outputs.base }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAIN_COUNT: ${{ steps.plan.outputs.main_count }}
          PROJECTED: ${{ steps.plan.outputs.projected }}
          PR_PKG: ${{ steps.plan.outputs.pr_pkg }}
        run: |
          if [ "$IS_RELEASE_PR" = "true" ]; then
            {
              printf '<!-- agy-release-plan -->\n'
              printf '### Release PR\n\n'
              printf '| | |\n| --- | --- |\n'
              printf '| Current release | %s |\n' "$BASE"
              printf '| Target release | v%s |\n' "$PR_PKG"
              printf '\nMerging this Release PR will tag `v%s`, build the standalone binaries, and publish the GitHub Release using the `## [%s]` section from `CHANGELOG.md`.\n' "$PR_PKG" "$PR_PKG"
            } > /tmp/release-plan.md
          else
            {
              printf '<!-- agy-release-plan -->\n'
              printf '### Release plan\n\n'
              printf '| | |\n| --- | --- |\n'
              printf '| This PR bump | %s |\n' "$PR_BUMP"
              printf '| Latest release | %s (commits queued on `main`: %s) |\n' "$TAG" "$MAIN_COUNT"
              printf '| Projected next release | v%s (%s) |\n' "$PROJECTED" "$COMBINED_BUMP"
              printf '\nMerging this PR accumulates on `main` without cutting a release. When ready to ship, open and merge a Release PR (`/release` / `bun run release:prepare`) or run the **Release** workflow manually (`workflow_dispatch`).\n\n'
              printf 'Classification comes from the PR title (`feat:` -> minor, `feat!:` or `BREAKING CHANGE:` footer -> major, everything else -> patch). Retitle the PR to change its label.\n'
            } > /tmp/release-plan.md
          fi
          EXISTING="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- agy-release-plan -->")) | .id' | head -n1)"
          if [ -n "$EXISTING" ]; then
            jq -n --rawfile body /tmp/release-plan.md '{body: $body}' > /tmp/release-plan.json
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" --input /tmp/release-plan.json >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/release-plan.md >/dev/null
          fi
